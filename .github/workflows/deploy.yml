name: Deploy VitePress site to Pages

on:
  pull_request:
    branches:
      - main
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types:
      - lyrics-card-docs-updated
      - project-docs-updated
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve scheduled source updates
        if: github.event_name == 'schedule' || github.event_name == 'repository_dispatch'
        run: npm run docs:refresh

      - name: Pull project documentation
        run: npm run docs:pull

      - name: Full site validation
        run: npm run check

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium

      - name: Test browser behavior
        run: npm run docs:e2e

      - name: Audit build dependencies
        run: npm run docs:audit

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
